experiment_name: experiment_name

paths:
  logs: /path/to/logs
  output: /path/to/output
  preprocessed_zarr: /path/to/preprocessed_zarr
  regridding_weights: /path/to/regridding_weights
  hrdps: null  # Not required for inference
  hrdps_geophysical: /path/to/hrdps/geophysical/fields
  rdps: /path/to/rdps/data

preprocessing:
  global_start_datetime: "2017-05-22 07:00:00"
  global_end_datetime: "2024-09-01 12:00:00"
  coarsen_factor: 4
  tile_size: 512
  tiles_center_lon:
    - 284.30
  tiles_center_lat:
    - 45.42
  hrdps:
    skip: false
    variables:
      # - "HRDPS_P_TT_10000"
      # - "HRDPS_P_PR_SFC"
      # - "HRDPS_P_UUC_10000"
      # - "HRDPS_P_VVC_10000"
      - "orog"  # Providing orog here will generate the default geophysical fields in zarr format in inference mode
    start_datetime: "2017-05-22 07:00:00"  # Start at hour 1 considering 7-12 forecast extraction (for chunks synchronization in zarr)
    end_datetime: "2017-05-22 08:00:00"
    compute_upscaled_version: false
  rdps:
    skip: false
    variables:
      - "TT_model_levels"
      - "PR"
      - "UU_model_levels"
      - "VV_model_levels"
      - "PC"
      - "PN"
      - "TT850"  # end of tier 1
      - "GZ500"
      - "GZ850"
      - "HU850"
      - "HU700"
      - "TD"
      - "UU850"
      - "VV850"  # end of tier 2
    start_datetime: "2024-05-22 01:00:00"  # Start at hour 1 considering 7-12 forecast extraction (for chunks synchronization in zarr)
    end_datetime: "2024-05-22 02:00:00"

data:
  rdps_variables:
    - "TT_model_levels"
    - "PR"
    - "UU_model_levels"
    - "VV_model_levels"
    - "PC"
    - "PN"
    - "TT850"  # end of tier 1
    - "GZ500"
    - "GZ850"
    - "HU850"
    - "HU700"
    - "TD"
    - "UU850"
    - "VV850"  # end of tier 2
  hrdps_variables:
    - "HRDPS_P_TT_10000"
    - "HRDPS_P_PR_SFC"
    - "HRDPS_P_UUC_10000"
    - "HRDPS_P_VVC_10000"
  hrdps_geophysical_variables:
    - "orog"
    - "sftlf"
  validation_period_start: "2023-01-10 00:00:00"
  test_period_start: "2023-06-01 00:00:00"
  batch_size: 32
  num_workers: 8

model:
  kernel_size: 3
  initial_nb_of_hidden_channels: 144
  depth: 2
  reduction_ratio: 4

loss:
  mse_weight: 0.5
  mae_weight: 0.0
  mass_weight: 0.1
  ssim_weight: 0.4

training:
  nb_of_epochs: 0  # 0 epochs for inference only
  num_threads: 16
  device: cuda  # cpu or cuda
  optimizer:
    lr: 0.002
    weight_decay: 0.00001

inference:
  variables:
    - "HRDPS_P_TT_10000"
    - "HRDPS_P_PR_SFC"
    - "HRDPS_P_UUC_10000"
    - "HRDPS_P_VVC_10000"
  start_datetime: "2024-05-22 01:00:00"
  end_datetime: "2024-05-22 02:00:00"
  model_path: /path/to/unet_epoch_experiment_name_best_epoch.safetensors
  device: cpu  # cpu or cuda

# Metadata for the STAC/MLM extension (read by notebooks/unetToMLM.ipynb, not used by the workflow)
# Note that ideally the grid information should be retrieved from the data files
metadata:
  workflow_command: |
    snakemake -s scripts/meta_workflows/downscaling/rdps_to_hrdps.smk \
      --config config_yaml=/path/to/downscaling_rdps_to_hrdps.yaml \
      -j1 \
      --directory=/path/to/workflow/outputs
  hrdps_extent_coordinates:
    lat_min: 27.284586
    lat_max: 70.6115
    lon_min: -152.73064
    lon_max: -40.708557
  hrdps_shape:
    rlat_size: 1290
    rlon_size: 2540
  rdps_extent_coordinates:
    lat_min: -7.7491064
    lat_max: 89.96573
    lon_min: 0.00029021563
    lon_max: 359.9995
  rdps_shape:
    rlat_size: 1076
    rlon_size: 1102
  rdps_coarse_i_0237_j_1568_grid_extent_coordinates:
    lat_min: 37.57
    lat_max: 53.21
    lon_min: -86.39
    lon_max: -64.23
  rdps_coarse_i_0237_j_1568_grid_shape:
    rlat_size: 128
    rlon_size: 128
  hrdps_i_0237_j_1568_grid_extent_coordinates:
    lat_min: 37.52
    lat_max: 53.25
    lon_min: -86.45
    lon_max: -64.16
  hrdps_i_0237_j_1568_grid_shape:
    rlat_size: 512
    rlon_size: 512
  framework: pytorch
  framework_version: '2.9.0+cu130'
